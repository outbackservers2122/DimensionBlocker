plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Default run configurations.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from.
            // Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // GameTest server configuration.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // Data generation output.
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        // Applies to all run configurations.
        configureEach {
            // Recommended logging markers.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level.
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // Define mod source bindings.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    // No additional dependencies required for DimensionBlocker.
}

// Generate mod metadata from the template.
var generateModMetadata = tasks.register(
        "generateModMetadata",
        ProcessResources
) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors             : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include generated mod metadata in the resources.
sourceSets.main.resources.srcDir generateModMetadata

// Automatically run metadata generation when syncing the IDE.
neoForge.ideSyncTask generateModMetadata

// Maven publishing configuration.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Download dependency sources and Javadocs in IntelliJ IDEA.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}